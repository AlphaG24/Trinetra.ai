services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --dev
    ports:
      - "7880:7880"       # WebSocket signal
      - "7881:7881/tcp"   # RTC TCP
      - "7882:7882/udp"   # RTC UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    restart: unless-stopped
