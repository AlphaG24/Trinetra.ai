<!DOCTYPE html><html><head><meta charset='UTF-8'><style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    @page { size: A4 portrait; margin: 0; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff; color: #09090b; }
    .sheet { width: 210mm; height: 297mm; max-height: 297mm; min-height: 297mm; overflow: hidden; margin: 0 auto; padding: 16mm 18mm 14mm 18mm; display: flex; flex-direction: column; justify-content: space-between; }
    .sheet-dark { background: #000000 !important; color: #ffffff !important; }
    .sheet-light { background: #ffffff !important; color: #09090b !important; }
    .content-flow { display: flex; flex-direction: column; gap: 16px; }
    .top-running-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 6px; border-bottom: 1px solid #e4e4e7; }
    .top-running-bar-dark { border-bottom: 1px solid #27272a; }
    .hairline { border: none; height: 1px; background: #e4e4e7; margin: 6px 0; }
    .hairline-dark { border: none; height: 1px; background: #27272a; margin: 6px 0; }
    .section-label { font-size: 8pt; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #71717a; margin-bottom: 4px; }
    .section-label-dark { color: #a1a1aa; }
    .page-title { font-size: 21pt; font-weight: 800; letter-spacing: -0.03em; line-height: 1.22; color: #000000; margin-bottom: 8px; }
    .page-title-dark { color: #ffffff; font-size: 26pt; line-height: 1.2; }
    .page-desc { font-size: 10pt; font-weight: 400; line-height: 1.65; color: #52525b; margin-bottom: 2px; }
    .page-desc-dark { color: #d4d4d8; }
    .card-bw { background: #ffffff; border: 1px solid #e4e4e7; border-radius: 6px; padding: 16px 18px; }
    .card-bw-dark { background: #09090b; border: 1px solid #27272a; border-radius: 6px; padding: 18px 20px; }
    .card-bw-highlight { background: #fafafa; border: 1.5px solid #000000; border-radius: 6px; padding: 16px 18px; }
    .footer-bw { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #e4e4e7; font-size: 8pt; color: #71717a; font-weight: 500; letter-spacing: 0.04em; }
    .footer-bw-dark { border-top: 1px solid #27272a; color: #71717a; }
    .tag-bw { display: inline-block; font-size: 7.5pt; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; background: #000000; color: #ffffff; }
    .tag-bw-outline { display: inline-block; font-size: 7.5pt; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; border: 1px solid #d4d4d8; color: #27272a; background: #ffffff; }
    .tag-bw-outline-dark { border: 1px solid #3f3f46; color: #e4e4e7; background: #18181b; padding: 2px 7px; border-radius: 3px; font-size: 7.5pt; font-weight: 600; text-transform: uppercase; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
    .feature-list { list-style: none; margin-top: 8px; }
    .feature-list li { font-size: 9.5pt; color: #3f3f46; line-height: 1.6; margin-bottom: 7px; position: relative; padding-left: 18px; }
    .feature-list li::before { content: "✓"; position: absolute; left: 0; color: #000000; font-weight: 800; font-size: 8.5pt; }
    </style></head><body></body></html>
