<!DOCTYPE html><html><head><meta charset='UTF-8'><style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    @page { size: A4 portrait; margin: 0; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff; color: #09090b; }
    .sheet { width: 210mm; height: 297mm; max-height: 297mm; overflow: hidden; margin: 0 auto; padding: 18mm 18mm 16mm 18mm; display: flex; flex-direction: column; justify-content: space-between; }
    .sheet-dark { background: #000000 !important; color: #ffffff !important; }
    .sheet-light { background: #ffffff !important; color: #09090b !important; }
    .hairline { border: none; height: 1px; background: #e4e4e7; margin: 12px 0; }
    .hairline-dark { border: none; height: 1px; background: #27272a; margin: 14px 0; }
    .section-label { font-size: 8.5pt; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #71717a; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .section-label-dark { color: #a1a1aa; }
    .page-title { font-size: 20pt; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; color: #000000; margin-bottom: 6px; }
    .page-title-dark { color: #ffffff; font-size: 26pt; }
    .page-desc { font-size: 9.5pt; font-weight: 400; line-height: 1.45; color: #52525b; max-width: 680px; }
    .page-desc-dark { color: #a1a1aa; }
    .card-bw { background: #ffffff; border: 1px solid #e4e4e7; border-radius: 6px; padding: 12px 14px; }
    .card-bw-dark { background: #09090b; border: 1px solid #27272a; border-radius: 6px; padding: 14px; }
    .matrix-table { width: 100%; border-collapse: collapse; font-size: 8.5pt; margin-top: 6px; }
    .matrix-table th { text-align: left; font-size: 8pt; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #71717a; border-bottom: 2px solid #000000; padding: 7px 8px; background: #fafafa; }
    .matrix-table td { padding: 8px; border-bottom: 1px solid #e4e4e7; color: #18181b; vertical-align: middle; }
    .footer-bw { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #e4e4e7; font-size: 7.5pt; color: #71717a; font-weight: 500; letter-spacing: 0.04em; }
    .footer-bw-dark { border-top: 1px solid #27272a; color: #71717a; }
    .tag-bw { display: inline-block; font-size: 7pt; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; border: 1px solid #000000; background: #000000; color: #ffffff; }
    .tag-bw-outline { display: inline-block; font-size: 7pt; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; border: 1px solid #d4d4d8; color: #27272a; background: #ffffff; }
    .tag-bw-outline-dark { border: 1px solid #3f3f46; color: #e4e4e7; background: #18181b; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
    .spec-list { list-style: none; margin-top: 6px; }
    .spec-list li { font-size: 8.5pt; color: #3f3f46; line-height: 1.45; margin-bottom: 5px; position: relative; padding-left: 14px; }
    .spec-list li::before { content: "▪"; position: absolute; left: 0; color: #000000; font-size: 9pt; top: -1px; }
    </style></head><body></body></html>
